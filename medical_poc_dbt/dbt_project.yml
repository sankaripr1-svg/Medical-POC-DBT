name: medical_poc_dbt
version: '1.0.0'
config-version: 2
profile: medical_poc_dbt
model-paths: ['models']
macro-paths: ['macros']
seed-paths: ['seeds']
snapshot-paths: ['snapshots']
test-paths: ['tests']
analysis-paths: ['analyses']
clean-targets: ['target', 'dbt_packages']
models:
  medical_poc_dbt:
    staging:
      +materialized: view
      +schema: staging
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
seeds:
  medical_poc_dbt:
    +schema: seeds
    claim_status_mapping:
      +column_types:
        claim_status: varchar(30)
        status_category: varchar(30)
        is_final: boolean